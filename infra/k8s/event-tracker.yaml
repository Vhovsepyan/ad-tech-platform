apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-tracker-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-tracker
  template:
    metadata:
      labels:
        app: event-tracker
    spec:
      containers:
        - name: event-tracker
          image: adtech-event-tracker:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: KAFKA_BROKERS
              value: "redpanda:9092"
            - name: KAFKA_EVENTS_TOPIC
              value: "ad_events"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: RUST_LOG
              value: "info"

---
apiVersion: v1
kind: Service
metadata:
  name: event-tracker-service
spec:
  type: LoadBalancer
  selector:
    app: event-tracker
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
